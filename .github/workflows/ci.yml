name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Qt needs its platform libraries even to run headless. The tests use the
      # offscreen plugin, which still links EGL and fontconfig.
      - name: Install Qt's runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The fixtures are signed at collection time; openssl ships with every
      # runner image, and a missing one would silently skip the CMS tests.
      - name: Check that openssl is available
        run: openssl version

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Self-check the application starts
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m p7mmanager --self-check
