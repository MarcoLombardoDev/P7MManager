name: Release

# One workflow, three real platforms.
#
# PyInstaller does not cross-compile: the only way to produce a genuine Windows
# executable, a macOS bundle and a Linux binary is to build each one on its own
# machine. GitHub hands out all three on demand, so the matrix below does
# exactly that — nothing here is a cross-build.
#
# Two ways in, converging on the same result:
#
#   * a "v*" tag appears — creates the release, then attaches the binaries.
#     Pushing the tag with git does this, and so does publishing a release
#     through GitHub's own UI, which creates the tag and fires the same event.
#   * run it by hand — pass the tag; attaches to that release. This is the way
#     in for a tag that already existed before this workflow did.
#
# Deliberately NOT also triggered by "release: published": that event and the
# tag's push event both fire when a release is published from the UI, and two
# runs would then race to upload the same asset names.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach the binaries to (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # The bundle's name on disk, which is not the display name: PyInstaller's
  # output path, the executable and the archives all use this one.
  APP_NAME: P7MManager
  PYTHON_VERSION: "3.12"

jobs:
  # The release object is created — or corrected — before anything is built, so
  # the three matrix jobs always have somewhere to upload to, whichever trigger
  # started the run, and so the description is written once from a file in the
  # repository instead of three times from three runners.
  release:
    name: Prepare the release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Work out which tag to build
        id: tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          case "$tag" in
            v[0-9]*) ;;
            *)
              echo "::error::'$tag' is not a version tag. Expected something like v1.2.3."
              exit 1
              ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      # The notes live in .github/release-body.md, next to this file, so the
      # text a downloader reads can be edited without touching a workflow.
      # --generate-notes is deliberately not used: it emits the commit log,
      # which is engineering shorthand, not a description of what is being
      # downloaded.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          notes="$(sed "s/{{VERSION}}/$VERSION/g; s/{{TAG}}/$TAG/g" .github/release-body.md)"
          title="P7M Manager $TAG"
          # `gh release create` fails outright when a release already exists for
          # the tag — the normal case when the tag was created by publishing a
          # release through GitHub's UI. The fallback converges on the same
          # state: same title, same notes, published rather than left a draft.
          gh release create "$TAG" --title "$title" --notes "$notes" \
            || gh release edit "$TAG" --title "$title" --notes "$notes" --draft=false

  build:
    name: ${{ matrix.label }}
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (x64)
            asset: windows-x64
          - os: macos-latest
            label: macOS (arm64)
            asset: macos-arm64
          - os: ubuntu-latest
            label: Linux (x64)
            asset: linux-x64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install the platform's system libraries
        if: runner.os == 'Linux'
        run: |
          # PySide6 needs shared libraries the runner image omits, and xvfb so
          # the smoke test below can load the real xcb plugin rather than
          # offscreen.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxkbcommon0 xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Build
        run: pyinstaller --noconfirm --clean p7mmanager.spec

      # Where the build put its output, and which file inside it is the
      # program. Decided once, here, so the smoke test and the packaging step
      # cannot end up disagreeing about what ships.
      - name: Locate what was built
        id: built
        shell: bash
        run: |
          suffix=""
          [ "$RUNNER_OS" = "Windows" ] && suffix=".exe"

          if [ "$RUNNER_OS" = "macOS" ] && [ -d "dist/$APP_NAME.app" ]; then
            payload="dist/$APP_NAME.app"
            bin="dist/$APP_NAME.app/Contents/MacOS/$APP_NAME"
          else
            payload="dist/$APP_NAME"
            bin="dist/$APP_NAME/$APP_NAME$suffix"
          fi

          if [ ! -e "$payload" ]; then
            echo "::error::the build produced nothing at $payload"
            ls -la dist || true
            exit 1
          fi
          echo "payload=$payload" >> "$GITHUB_OUTPUT"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      # A bundle that cannot start is worse than no bundle, so it is run before
      # it is offered for download.
      #
      # --version alone is not a smoke test: argparse prints the version and
      # exits before PySide6 is ever imported, so a bundle whose Qt platform
      # plugin is missing passes it and then fails on the user's desktop.
      # --self-check constructs QApplication, which is what makes Qt load a
      # platform plugin, and prints which one it got.
      - name: Smoke-test the bundle
        shell: bash
        env:
          BIN: ${{ steps.built.outputs.bin }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          chmod +x "$BIN" 2>/dev/null || true

          # The tag names the archive; this is the version the program itself
          # reports. Without this check a tag would happily produce
          # P7MManager-1.0.0-windows-x64.zip containing a program that says
          # 2.3.0 when asked — a download whose name and contents disagree.
          #
          # tr -d because a Windows build prints CRLF.
          reported=$("$BIN" --version | tr -d '\r')
          echo "$reported"
          case "$reported" in
            *" $VERSION") ;;
            *)
              echo "::error::the tag says $VERSION but the program says '$reported'"
              echo "::error::update the version in the source, or tag the version the source has"
              exit 1
              ;;
          esac

          if [ "$RUNNER_OS" = "Linux" ]; then
            # Under a virtual X server and the real xcb plugin — not offscreen,
            # which loads none of the X libraries and so would not notice a
            # broken xcb backend at all.
            output=$(xvfb-run -a env QT_QPA_PLATFORM=xcb "$BIN" --self-check | tr -d '\r')
          else
            output=$("$BIN" --self-check | tr -d '\r')
          fi
          echo "$output"

          plugin=$(echo "$output" | sed -n 's/^platform plugin: //p')
          case "$RUNNER_OS:$plugin" in
            Linux:xcb|macOS:cocoa|Windows:windows) ;;
            *)
              echo "::error::$RUNNER_OS bundle came up on platform plugin '$plugin'"
              exit 1
              ;;
          esac

      # The archive carries the licence texts as well as the program: AGPL-3.0
      # section 5 asks for them, and a downloader who never opens the
      # repository has no other copy.
      - name: Package
        id: package
        shell: bash
        env:
          PAYLOAD: ${{ steps.built.outputs.payload }}
          VERSION: ${{ needs.release.outputs.version }}
          ASSET: ${{ matrix.asset }}
        run: |
          staging="staging/$APP_NAME"
          mkdir -p "$staging"
          cp -R "$PAYLOAD" "$staging/"
          cp LICENSE COMMERCIAL-LICENSE.md README.md CHANGELOG.md "$staging/"

          name="$APP_NAME-$VERSION-$ASSET"
          if [ "$RUNNER_OS" = "Linux" ]; then
            archive="$name.tar.gz"
            tar -czf "$archive" -C staging "$APP_NAME"
          else
            archive="$name.zip"
            # ditto on macOS keeps the bundle's symlinks and permissions, which
            # a plain zip flattens into an .app that will not launch.
            if [ "$RUNNER_OS" = "macOS" ]; then
              ditto -c -k --sequesterRsrc --keepParent "staging/$APP_NAME" "$archive"
            else
              powershell -Command "Compress-Archive -Path staging/$APP_NAME -DestinationPath $archive -CompressionLevel Optimal"
            fi
          fi

          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          # Filed in the run's summary rather than uploaded: a .sha256 asset
          # downloaded over the same connection as the file it checks proves
          # very little, and the summary is where someone verifying a download
          # can read it without downloading anything.
          if command -v sha256sum >/dev/null; then
            sum=$(sha256sum "$archive")
          else
            sum=$(shasum -a 256 "$archive")
          fi
          echo "$sum"
          echo "\`$sum\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        shell: bash
        run: gh release upload "$TAG" "$ARCHIVE" --clobber
