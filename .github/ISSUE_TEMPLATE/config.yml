# Routes non-bug traffic away from public Issues.
#
# Commercial terms, pricing and Corporate CLAs are negotiated privately, so the
# new-issue chooser offers them as an email link rather than letting them land
# in a public thread.
blank_issues_enabled: true
contact_links:
  - name: 💼 Commercial or Redistribution licence enquiry
    url: mailto:marco.lombardo@gmail.com?subject=P7M%20Manager%20commercial%20licence%20enquiry
    about: >-
      Buying a licence, pricing, redistribution/OEM or embedding the engine in a
      product you sell. Handled by email, not in public Issues — see
      COMMERCIAL-LICENSE.md for the tiers.
  - name: 📄 Contributor License Agreement (CLA) questions
    url: mailto:marco.lombardo@gmail.com?subject=P7M%20Manager%20CLA
    about: Individual or Corporate CLA questions, including employer sign-off.
  - name: 🔐 Security vulnerability
    url: mailto:marco.lombardo@gmail.com?subject=P7M%20Manager%20security%20report
    about: >-
      Report privately, and never attach a real .p7m — a signed container carries
      the signer's certificate and often the document itself. P7M Manager parses
      files a user may not have written, so please do not open a public issue for
      a security problem.
